services:
  touchscreen-display:
    build:
      context: ./touchscreen-display
      dockerfile: Dockerfile
    container_name: touchscreen-display
    environment:
      # Resolve at runtime to whatever host serves the kiosk UI unless overridden externally
      NEXT_PUBLIC_CHATBOT_API_BASE: ""
      NEXT_PUBLIC_OCR_API_BASE: ""
      NEXT_PUBLIC_BACKEND_API_BASE: ""
      NEXT_PUBLIC_WS_URL: ""
    expose:
      - "3000"
    volumes:
      - eic_node_modules:/app/node_modules
      - /etc/ssl/eic:/certs:ro
      - ./touchscreen-display:/app
    command: >
      sh -lc "npx next dev --hostname 0.0.0.0 --port 3000"
    depends_on:
      - server
      - alexandra-backend
    restart: unless-stopped

  server:
    build:
      context: ./server
    expose:
      - "8080"
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules
    command: npm run start

  alexandra-backend:
    build:
      context: ./backend-alexandra/backend
      dockerfile: Dockerfile
    container_name: alexandra-backend
    env_file:
      - ./backend-alexandra/backend/.env
    volumes:
      - ./backend-alexandra/backend:/app
      - /etc/ssl/eic:/certs:ro
    expose:
      - "8000"
    restart: unless-stopped

  hologram-display:
    build:
      context: ./hologram-display
    ports:
      - "3001:80"
    volumes:
      - ./hologram-display:/usr/share/nginx/html:ro

  ocr:
    build:
      context: ./ocr-service
      dockerfile: Dockerfile
    container_name: eic-ocr
    privileged: true
    devices:
      - /dev/vchiq:/dev/vchiq
      - /dev/video0:/dev/video0
      - /dev/video1:/dev/video1
      - /dev/media0:/dev/media0
      - /dev/vcsm:/dev/vcsm
    volumes:
      - ./ocr-service:/app
      - /run/udev:/run/udev:ro
      - /home/rex/ocr_latest:/data/ocr_latest
      - /etc/ssl/eic:/certs:ro
    environment:
      PICAMERA2_TEST_ENV: 1
      PYTHONUNBUFFERED: 1
      YOLO_CONFIG_DIR: /app/.ultralytics
    command: >
      python3 -m uvicorn service:app
      --host 0.0.0.0
      --port 9000
      --log-level debug
    expose:
      - "9000"
    restart: unless-stopped

  chatbot-backend:
    build:
      context: ./chatbot
      dockerfile: Dockerfile
    container_name: chatbot-backend
    env_file:
      - ./chatbot/.env
    environment:
      PIPER_VOICE: en_US-amy-low
      PIPER_VOICE_PATH: /voices/en_US-amy-low.onnx
    volumes:
      - /etc/ssl/eic:/certs:ro
      - ./chatbot/app/voices:/voices:ro
    command: >
      uvicorn app.dialog:app
      --host 0.0.0.0
      --port 8001
    expose:
      - "8001"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: eic-caddy
    depends_on:
      - server
      - alexandra-backend
      - ocr
      - chatbot-backend
      - touchscreen-display
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /etc/ssl/eic:/certs:ro
    ports:
      - "3000:3000"
      - "8080:8080"
      - "8000:8000"
      - "8001:8001"
      - "9000:9000"
    restart: unless-stopped

volumes:
  eic_node_modules:
  server_node_modules:

networks:
  default:
    name: eic-kiosk-net
