  #     - ./touchscreen-display:/app
  #   command: >
  #     sh -lc "npx next dev --hostname 0.0.0.0 --port 3000"
  #   depends_on:
  #     - server
  #     # - alexandra-backend
  #   restart: unless-stopped

  touchscreen-display:
    build:
      context: ./touchscreen-display
      dockerfile: Dockerfile.prod
    container_name: touchscreen-display
    environment:
      NEXT_PUBLIC_CHATBOT_API_BASE: ""
      NEXT_PUBLIC_OCR_API_BASE: ""
      NEXT_PUBLIC_BACKEND_API_BASE: ""
      NEXT_PUBLIC_WS_URL: ""
      NODE_ENV: production
      PORT: "3000"
    expose:
      - "3000"
    volumes:
      - ./certs:/certs:ro
    command: >
      sh -lc "npx next start --hostname 0.0.0.0 --port 3000"
    depends_on:
      - server
      # - alexandra-backend
    restart: unless-stopped

  server:
    build:
      context: ./server
    expose:
      - "8080"
    volumes:
      - ./server:/app
      - ./certs:/certs:ro
      - server_node_modules:/app/node_modules
    command: npm run start:ws

  # alexandra-backend:
  #   build:
  #     context: ./backend-alexandra/backend
  #     dockerfile: Dockerfile
  #   container_name: alexandra-backend
  #   env_file:
  #     - ./backend-alexandra/backend/.env
  #   volumes:
  #     - ./backend-alexandra/backend:/app
  #     - ./certs:/certs:ro
  #   expose:
  #     - "8000"
  #   restart: unless-stopped

  hologram-display:
    build:
      context: ./hologram-display
    ports:
      - "3001:80"
      - "3443:443"
    volumes:
      - ./hologram-display:/usr/share/nginx/html:ro
      - ./certs:/certs:ro

  ocr:
    build:
      context: ./ocr-service
      dockerfile: Dockerfile
    container_name: eic-ocr

    devices:
      - /dev/video0:/dev/video0
      - /dev/video1:/dev/video1 # keep if present; harmless if absent
      - /dev/media0:/dev/media0
      - /dev/media1:/dev/media1
      - /dev/media2:/dev/media2
      - /dev/media3:/dev/media3
    privileged: true

    group_add:
      - video

    volumes:
      - ./ocr-service:/app
      - /run/udev:/run/udev:ro # ok to keep for hotplug info
      - ../ocr_latest:/data/ocr_latest
      - ./certs:/certs:ro

    environment:
      PYTHONUNBUFFERED: 1
      YOLO_CONFIG_DIR: /app/.ultralytics
      CAMERA_ENABLED: "1"
      USB_DEVICE_INDEX: "0" # change to 1/2 if needed
      USB_WIDTH: "1280"
      USB_HEIGHT: "720"
      USB_FPS: "30"
      YOLO_DEBUG_DIR: /app/api/debug
      YOLO_DEBUG_LIMIT: "50"

    command: >
      python3 -m uvicorn service:app
      --host 0.0.0.0
      --port 9000
      --log-level debug

    expose:
      - "9000"
    restart: unless-stopped

  chatbot-backend:
    build:
      context: ./chatbot
      dockerfile: Dockerfile
    container_name: chatbot-backend
    env_file:
      - ./chatbot/.env
    environment:
      PIPER_VOICE: en_US-amy-low
      PIPER_VOICE_PATH: /voices/en_US-amy-low.onnx
    volumes:
      - ./certs:/certs:ro
      - ./chatbot/app/voices:/voices:ro
      - ./data/directions-nus.csv:/data/directions-nus.csv:ro
      - ./data/directions-ah.csv:/data/directions-ah.csv:ro
    command: >
      uvicorn app.dialog:app
      --host 0.0.0.0
      --port 8001
    expose:
      - "8001"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: eic-caddy
    depends_on:
      - server
      - alexandra-backend
      - ocr
      - chatbot-backend
      - touchscreen-display
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
    ports:
      - "3000:3000"
      - "8080:8080"
      - "8000:8000"
      - "8001:8001"
      - "9000:9000"
    restart: unless-stopped

  rfid:
    build:
      context: ./rfid
    ports:
      - "5000:5000"
    privileged: true
    devices:
      # - "/dev/input/by-id/usb-ARM_CM0_USB_HID_Keyboard_BAF1D93D1201-event-kbd:/dev/input/event1" #for keyboard mode
      - "/dev/ttyACM0:/dev/ttyACM0"
    volumes:
      - ./rfid:/app
      - ./certs:/certs:ro
    command: python rfid-serial.py

  nfc:
    build:
      context: ./nfc
    privileged: true
    devices:
      - "/dev/ttyAMA0:/dev/serial0"
    ports:
      - "5001:5001"
    environment:
      GPIOZERO_PIN_FACTORY: lgpio
    volumes:
      - ./nfc:/app
      - ./certs:/certs:ro
      - ./data/directions-nus.csv:/data/directions-nus.csv:ro
      - ./data/directions-ah.csv:/data/directions-ah.csv:ro
    command: python nfc.py

volumes:
  eic_node_modules:
  server_node_modules:

networks:
  default:
    name: eic-kiosk-net
